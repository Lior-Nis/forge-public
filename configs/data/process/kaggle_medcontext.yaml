# Labeled dataset processing for the medcontext (500-timestep) experiment.
# Three changes vs kaggle_longcontext (1000-timestep):
#   1. block_len 1000 → 500 (5 s patches at 100 Hz)
#   2. fog_stride_len 100: denser stride over FOG regions (vs stride_len=200 for background)
#   3. any_fog_labeling: patch is positive if ANY timestep is FOG (vs majority-vote)

defaults:
  - _self_

sampling_rate: 100

lengths:
  block_len: 500
  stride_len: 200
  fog_stride_len: 100

any_fog_labeling: true
data_type: labeled

zarr_config:
  chunk_size: 256
  compressor: lz4
  compression_level: 1

processor:
  _target_: data.process.processor.labeled.LabeledDataProcessor
