defaults:
  - _self_

sampling_rate: 100

lengths:
  block_len: 500
  stride_len: 50        # 10% advance → 10× overlap per timestep (Prisma-style inference)

data_type: labeled

zarr_config:
  chunk_size: 256
  compressor: lz4
  compression_level: 1

processor:
  _target_: data.process.processor.labeled.LabeledDataProcessor
