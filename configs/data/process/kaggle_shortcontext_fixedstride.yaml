defaults:
  - _self_

sampling_rate: 100

lengths:
  block_len: 200
  stride_len: 10
  # no fog_stride_len — fixed stride ensures session_idx * stride_len
  # gives correct patch start positions in eval reconstruction

any_fog_labeling: true
data_type: labeled

zarr_config:
  chunk_size: 256
  compressor: lz4
  compression_level: 1

processor:
  _target_: data.process.processor.labeled.LabeledDataProcessor
