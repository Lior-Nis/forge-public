# Processing config for FogAtHome medcontext (500-timestep, 5s) zarr.
# Uses fog-biased stride (denser near FOG events) and continuous fog_ratio patch_labels.

defaults:
  - _self_

sampling_rate: 100

lengths:
  block_len: 500
  stride_len: 200
  fog_stride_len: 100

fog_ratio_labeling: true
data_type: labeled

zarr_config:
  chunk_size: 256
  compressor: lz4
  compression_level: 1

processor:
  _target_: data.process.processor.labeled.LabeledDataProcessor
