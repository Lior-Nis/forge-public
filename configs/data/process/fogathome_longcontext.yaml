# Processing config for FogAtHome longcontext (1000-timestep, 10s) zarr.
# Uses fog-biased stride (denser near FOG events) and continuous fog_ratio patch_labels.
# Mirrors fogathome_medcontext.yaml — same stride/fog_stride ratios, longer window.

defaults:
  - _self_

sampling_rate: 100

lengths:
  block_len: 1000
  stride_len: 200
  fog_stride_len: 100

fog_ratio_labeling: true
data_type: labeled

zarr_config:
  chunk_size: 256
  compressor: lz4
  compression_level: 1

processor:
  _target_: data.process.processor.labeled.LabeledDataProcessor
