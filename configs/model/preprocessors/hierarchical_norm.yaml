
_target_: model.preprocessors.SignalPreprocessor
preprocessors:
  - _target_: model.preprocessors.ResamplePreprocessor
    target_rate: 100
    original_rate: 100
    method: linear

  - _target_: model.preprocessors.UnitConversionPreprocessor
    from_unit: g
    to_unit: m/s2

  - _target_: model.preprocessors.SensorCalibrationPreprocessor
    calibration_matrix: null
    bias_vector: null
    apply_per_session: false

  - _target_: model.preprocessors.DetrendPreprocessor
    method: linear
    poly_order: 2

  - _target_: model.preprocessors.BandpassFilterPreprocessor
    low_freq: 0.5
    high_freq: 20.0
    order: 4
    sample_rate: 100

  - _target_: model.preprocessors.PatientNormalizationPreprocessor
    num_features: 3
    stats: null
    method: zscore
    eps: 1e-8

  - _target_: model.preprocessors.SessionNormalizationPreprocessor
    num_features: 3
    method: revin
    eps: 1e-5
    affine: true
    subtract_last: false
    freq_bands:
      - [0.5, 3.0]
      - [3.0, 8.0]
      - [8.0, 20.0]
    sample_rate: 100.0
