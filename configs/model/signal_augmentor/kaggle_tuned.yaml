
_target_: model.augmentors.SignalAugmenter
augmentors:

  - _target_: model.augmentors.LRFlipAugmentor
    augmentor_config:
      probability: 0.5

  - _target_: model.augmentors.ResizeAugmentor
    augmentor_config:
      probability: 0.8
      stretch_std: 0.5

  - _target_: model.augmentors.ExciseAugmentor
    augmentor_config:
      probability: 0.1
      max_excise_fraction: 0.3
      min_gap_length: 50
      max_gap_length: 150

  - _target_: model.augmentors.NoiseAugmentor
    augmentor_config:
      noise_probability: 0.5
      noise_level: 0.05
      impulse_probability: 0.2
      impulse_mask_probability: 0.01
      impulse_level: 0.2

  - _target_: model.augmentors.CropAugmentor
    augmentor_config:
      probability: 0.3
      max_crop_fraction: 0.9
      min_fraction: 0.1

  - _target_: model.augmentors.TimeMaskingAugmentor
    augmentor_config:
      time_masking_probability: 0.1
      time_masking_length_low_high: [10, 50]
      channel_mask_probability: 0.7

  - _target_: model.augmentors.TimeStretchAugmentor
    augmentor_config:
      time_wraping_probability: 0.3
      time_wrapping_channel_probability: 0.5
      strech_factor_base: 0.8
      strech_factor_slope: 0.4

  - _target_: model.augmentors.PhaseShiftAugmentor
    augmentor_config:
      phase_shift_probability: 0.2
      phase_shift_range_low_high: [-15, 16]
      phase_shift_channel_probability: 0.6

  - _target_: model.augmentors.TimeWarpingAugmentor
    augmentor_config:
      probability: 0.4
      warp_factor_range: [0.8, 1.2]

  - _target_: model.augmentors.SignalCutMixAugmentor
    augmentor_config:
      probability: 0.3
      segment_probability: 0.6
      min_cutmix_fraction: 0.2
      max_cutmix_fraction: 0.8
