# @package model.head
# Segmentation head: per-timestep binary FOG predictions.
# BiGRU processes temporal tokens from backbone, then each token position is
# projected to [B, T, 2]. repeat_interleave(time_patch) upsamples to full seq_len.
# target_seq_len must match the zarr block_len (e.g. 1000 for longcontext).

_target_: model.heads.RNNHead
input_dim: ${model.backbone.embed_dim}
rnn_type: 'GRU'
rnn_layers: 1
rnn_hidden_mult: 1
num_classes: 2
dropout: 0.0
sequence_output: true
bidirectional: true
input_seq_len: 20         # temporal tokens from backbone (block_len / time_patch)
target_seq_len: 1000      # output timesteps = block_len; override per-experiment
