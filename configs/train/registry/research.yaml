
project: "fog"
entity: null

auto_register: true
register_on_improvement: true
register_on_train_end: true
register_interval: 10

monitor_metric: "val_f1"
monitor_mode: "max"
min_improvement: 0.0005

artifact_name_template: "research-{architecture}-{transform}-epoch{epoch}"
artifact_description_template: "Research model: {architecture} on {transform} | Epoch {epoch} | {monitor_metric}: {metric_value:.4f}"

preferred_aliases: ["latest", "best-performing", "research-candidate"]
fallback_to_files: true
