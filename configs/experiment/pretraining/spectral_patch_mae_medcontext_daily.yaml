# @package _global_
#
# MAE 2D pretraining with 500-timestep patches (medcontext experiment).
# Three changes vs spectral_patch_mae_daily:
#   1. block_len 1000 → 500 (data/process: kaggle_medcontext_daily)
#   2. batch_size 320 → 640 (shorter sequences free GPU memory)
#   3. Checkpoint dir updated
#
# Pretraining data is unlabeled (kaggle daily-living), so adaptive stride and
# any-fog labeling do not apply here — only the shorter patch length matters.

defaults:
  - override /model: mae
  - override /train: mae
  - override /data: mae
  - override /model/backbone: spectral_patch_encoder
  - override /data/process: kaggle_medcontext_daily
  - override /data/paths: kaggle_daily_medcontext
  - override /data/splits: kaggle_daily/medcontext
  - override /train/trainer: ssl_pretrain
  - _self_

model:
  mask_mode: "2d_patch"
  mask_ratio: 0.5
  transform:
    _target_: model.transforms.WaveletTransform
    wavelet: 'morl'
    min_freq: 0.3
    max_freq: 50.0
    n_scales: 100
    highlight_transient: false
    transient_weight: 0.0
    img_size: ${global.img_size}
    interpolate: false
  head:
    freq_bins: 20       # = freq_patch (each token covers 20 freq bins)
    freq_patch: 20      # enables 2D reconstruction mode in MAEDecoderHead
    patch_size: 50      # = time_patch; 500 / 50 = 10 time tokens
    encoder_embed_dim: 512
    max_patches: 256    # 5 freq × 10 time = 50 tokens — well within limit

data:
  dataloader:
    batch_size: 640     # doubled from 320 (500-timestep patches use ~half the memory)

train:
  trainer:
    limit_val_batches: null   # full val — only ~635 batches with 2 val patients
  registry:
    artifact_name_template: "mae-spectralpatch-wavelet-medcontext-epoch{epoch}"
  callbacks:
    checkpoint:
      dirpath: "./checkpoints/mae/mae_medcontext_daily"

global:
  experiment_name: "spectral_patch_mae_medcontext_daily"
