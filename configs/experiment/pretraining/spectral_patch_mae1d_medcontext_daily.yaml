# @package _global_
#
# 1D-MAE pretraining at MEDIUM context (500 timesteps) on daily-living data.
# Budget-matched companion to spectral_patch_mae_medcontext_daily (2D-MAE MC).
#
# Identical to the 2D-MAE MC config EXCEPT mask_mode: "2d_patch" -> "1d".
# Same wavelet spectrogram, same depth-4 SpectralPatchEncoder, same data, same
# budget. The only difference is the masking pattern: 1D masks whole temporal
# columns (admits trivial interpolation through the bandlimited signal), 2D masks
# spectral-temporal patches. This isolates the contribution of the 2D structure.
#
# Pretraining data is unlabeled (kaggle daily-living, len500_stride200 zarr).

defaults:
  - override /model: mae
  - override /train: mae
  - override /data: mae
  - override /model/backbone: spectral_patch_encoder
  - override /data/process: kaggle_medcontext_daily
  - override /data/paths: kaggle_daily_medcontext
  - override /data/splits: kaggle_daily/ssl_pretraining
  - override /train/trainer: ssl_pretrain
  - _self_

model:
  mask_mode: "1d"          # <-- only substantive change vs 2D-MAE MC
  mask_ratio: 0.5
  transform:
    _target_: model.transforms.WaveletTransform
    wavelet: 'morl'
    min_freq: 0.3
    max_freq: 50.0
    n_scales: 100
    highlight_transient: false
    transient_weight: 0.0
    img_size: ${global.img_size}
    interpolate: false
  head:
    freq_bins: 20
    freq_patch: 20
    patch_size: 50          # 500 / 50 = 10 time tokens
    encoder_embed_dim: 512
    max_patches: 256

data:
  dataloader:
    batch_size: 640         # matches 2D-MAE MC (budget-matched)

train:
  trainer:
    limit_val_batches: null
  registry:
    artifact_name_template: "mae1d-spectralpatch-wavelet-medcontext-epoch{epoch}"
  callbacks:
    checkpoint:
      dirpath: "./checkpoints/mae/mae1d_medcontext_daily"

global:
  experiment_name: "spectral_patch_mae1d_medcontext_daily"
