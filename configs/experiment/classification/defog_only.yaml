# @package _global_

defaults:
  - /data/hierarchical_norm@data.hierarchical_norm: single_protocol
  - override /model/preprocessors@model.preprocessors: hierarchical_norm_pure
  - override /model/signal_augmentor@model.signal_augmentor: default
  - override /model/transform@model.transform: raw
  - override /model/backbone@model.backbone: fogformer_no_dropout
  - override /model/head@model.head: gru_binary_classification_heavy
  - override /train/optimizer@train.optimizer: adamw
  - override /train/scheduler@train.scheduler: cosine_restarts
  - override /train/loss@train.loss: focal_binary_bce
  - override /train/callbacks@train.callbacks: classification
  - override /train/trainer@train.trainer: fog_trainer_no_limits
  - override /train/logger@train.logger: classification
  - override /data/dataset@data.dataset: binary_dataset
  - override /data/dataloader@data.dataloader: classification_loader
  - override /data/paths@data.paths: kaggle_pure
  - override /data/process@data.process: kaggle
  - override /data/splits@data.splits: kaggle_labeled/dedup
  - _self_

global:
  experiment_name: defog_only
  seed: 42

model:
  img_size: ${global.img_size}
  head:
    dropout: 0.3

train:
  optimizer:
    lr: 1e-3
  trainer:
    max_epochs: 50
    limit_train_batches: null

data:
  paths:
    dataset_slug: kaggle_pure_defog
  dataloader:
    batch_size: 512
