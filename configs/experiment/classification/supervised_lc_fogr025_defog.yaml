# @package _global_
#
# Supervised baseline: SpectralPatchEncoder (vit4) trained end-to-end on defog,
# no pretraining. Identical architecture and data to spectral_patch_mae_lc_valid_defog.
# fog_ratio>=0.25 binary label, validity-only filter.
# Context: 1000-step (10s), time_patch=50, 20 temporal tokens.

defaults:
  - /data/hierarchical_norm@data.hierarchical_norm: cross_protocol
  - override /model/backbone: spectral_patch_encoder
  - override /data/process: kaggle_longcontext
  - override /data/paths: kaggle_defog_valid_longcontext
  - override /data/splits: kaggle_labeled/defog_only
  - override /model/signal_augmentor: default
  - override /model/preprocessors: hierarchical_norm_pure
  - override /model/head: gru_binary_classification_heavy
  - override /train/optimizer: adamw
  - override /train/scheduler: cosine
  - override /train/loss: focal_binary_ce
  - override /train/callbacks: classification
  - override /train/registry: default
  - override /train/trainer: fog_trainer_no_limits
  - override /train/logger: classification
  - override /data/dataset: fog_ratio_025_dataset
  - override /data/dataloader: classification_loader
  - _self_

global:
  experiment_name: supervised_lc_fogr025_defog
  seed: 42

model:
  img_size: ${global.img_size}
  transform:
    _target_: model.transforms.WaveletTransform
    wavelet: 'morl'
    min_freq: 0.3
    max_freq: 50.0
    n_scales: 100
    highlight_transient: false
    transient_weight: 0.0
    img_size: ${global.img_size}
    interpolate: false
  backbone:
    dropout: 0.1
  head:
    input_seq_len: 20   # 1000 / time_patch=50 = 20 temporal tokens
    dropout: 0.3

train:
  weights:
    load_from: null
    load_strategy: "all"
    freeze_backbone: false
    unfreeze_schedule:
      enabled: false

  optimizer:
    lr: 1e-4

  scheduler:
    T_max: 100

  trainer:
    max_epochs: 100
