# @package _global_
#
# Probe / finetune on defog using SpectralPatchEncoder pretrained with shortcontext
# MAE 2D (200-timestep patches).
#
# Key differences vs medcontext finetune:
#   1. data/process: kaggle_shortcontext (200-timestep, stride 20/10 adaptive, any-fog)
#   2. data/paths: kaggle_defog_pure_valid_shortcontext (pure+valid view of 200-len zarr)
#   3. backbone time_patch/patch_size: 10 (vs 50 for longcontext, 50 for medcontext)
#   4. head.input_seq_len: 20 (200 / time_patch=10 = 20 temporal tokens)

defaults:
  - /data/hierarchical_norm@data.hierarchical_norm: cross_protocol
  - override /model/backbone: spectral_patch_encoder
  - override /data/process: kaggle_shortcontext
  - override /data/paths: kaggle_defog_pure_valid_shortcontext
  - override /data/splits: kaggle_labeled/defog_only
  - override /model/signal_augmentor: default
  - override /model/preprocessors: hierarchical_norm_pure
  - override /model/head: gru_binary_classification_heavy
  - override /train/optimizer: adamw
  - override /train/scheduler: cosine
  - override /train/loss: focal_binary_ce
  - override /train/callbacks: classification
  - override /train/registry: default
  - override /train/trainer: fog_trainer_no_limits
  - override /train/logger: classification
  - override /data/dataset: binary_dataset
  - override /data/dataloader: classification_loader
  - _self_

global:
  experiment_name: spectral_patch_mae_shortcontext_finetune_defog
  seed: 42

model:
  img_size: ${global.img_size}
  transform:
    _target_: model.transforms.WaveletTransform
    wavelet: 'morl'
    min_freq: 0.3
    max_freq: 50.0
    n_scales: 100
    highlight_transient: false
    transient_weight: 0.0
    img_size: ${global.img_size}
    interpolate: false
  backbone:
    time_patch: 10
    patch_size: 10
    freq_patch: 20
    dropout: 0.0
  head:
    input_seq_len: 20   # 200 / time_patch=10 = 20 temporal tokens
    dropout: 0.3

train:
  weights:
    load_from: null     # set via CLI: train.weights.load_from=checkpoints/mae/...
    load_strategy: backbone_only
    freeze_backbone: true
    unfreeze_schedule:
      enabled: false

  optimizer:
    lr: 1e-3

  scheduler:
    T_max: 30

  trainer:
    max_epochs: 30
