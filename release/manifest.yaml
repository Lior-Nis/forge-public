meta:
  paper: FORGE - Self-supervised learning improves cross-cohort freezing-of-gait detection
    from a single lower-back accelerometer
  headline_model: mc_probe_ensemble
  released_seed: 42
  manuscript_seeds:
  - 42
  - 43
  - 44
  headline_model_note: The manuscript's released detector is nine BiGRU heads (3 participant
    folds x 3 seeds) over one shared frozen MC encoder. The public release contains
    all nine safetensors heads. External evaluation averages all nine; the DeFOG reference
    remains the seed-42 out-of-fold result.
  threshold_protocol: defog_val_pr11
  license: MIT
  hf_weights_repo: Liornis/forge-fog
  hf_dataset_repo: Liornis/fog-dataset
  hf_weights_revision: 3997f782f7567db357ee5caf0b134729a292f835
  hf_dataset_revision: f24fab4a5c1c88e376813fa9b0ec7bf28b1b32d3
encoders:
  lc:
    name: encoder_lc_mae
    hf_path: encoders/lc.safetensors
    local: release/forge-fog/encoders/lc.safetensors
    window_frames: 1000
    vit_depth: 4
    params: 14147072
    role: FORGE backbone (long context, 10s)
  mc:
    name: encoder_mc_mae
    hf_path: encoders/mc.safetensors
    local: release/forge-fog/encoders/mc.safetensors
    window_frames: 500
    vit_depth: 4
    params: 14147072
    role: FORGE backbone (medium context, 5s)
  sc:
    name: encoder_sc_mae
    hf_path: encoders/sc.safetensors
    local: release/forge-fog/encoders/sc.safetensors
    window_frames: 200
    vit_depth: 4
    params: 12918272
    role: FORGE backbone (short context, 2s)
