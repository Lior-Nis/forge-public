datasets:
  fogathome:
    hf_subdir: fogathome
    role: external_structured
    prevalence: 0.356
    n_patients: 12
  dailyliving:
    hf_subdir: fogathome_dailyliving
    role: external_naturalistic
    prevalence: 0.0109
    prevalence_eligible: 0.0292
    n_patients: 11
  kaggle:
    hf_subdir: kaggle_labeled
    role: in_distribution
    n_patients: 57
cohorts:
  kaggle:
    label: DeFOG
    n_participants: 57
    in_public_release: true
    role: supervised development + in-distribution reference
    note: 27.0 h structured at-home FOG protocol; source of the operating point.
  fogathome:
    label: FogAtHome-provoking
    n_participants: 12
    in_public_release: true
    shift: Cross-study / cross-cohort
  tdcs_fog:
    label: tDCS-FOG
    n_participants: 71
    in_public_release: false
    shift: Cross-protocol / acquisition
  stanford:
    label: Stanford
    n_participants: 7
    in_public_release: false
    shift: Cross-site / device / treatment state
  dailyliving:
    label: FogAtHome daily living
    n_participants: 11
    in_public_release: true
    shift: Structured supervised development -> naturalistic labeled evaluation
    note: Metrics are computed within prespecified label-independent walking-and-standing
      periods.
model_sets:
  mc_probe_ensemble:
    label: Released detector
    table: Table 3
    definition: 'Nine BiGRU heads over one shared frozen MC (5 s) encoder: 3 participant
      folds x 3 seeds (42, 43, 44). Within a seed the three fold scores are averaged
      at window level; the three seed-specific frame scores are then averaged with
      equal weight. Applied to every external cohort at the unchanged DeFOG-derived
      operating point of 0.35.'
  mc_matched_arms:
    label: 'Controlled comparison: self-supervised vs supervised from scratch'
    table: Table 2
    definition: Two arms differing only in encoder initialisation, under matched downstream
      training (same architecture, trainable parameters, DeFOG folds and optimiser).
      The self-supervised arm is joint encoder-classifier optimisation (the fine-tune
      arm). This is the abstract's headline effect and is a DIFFERENT model set from
      the released detector, so its values on the same cohort are lower.
  mc_probe_3fold_seed42:
    label: Seed-42 three-fold MC probe (in-distribution reference)
    table: Supplementary Table S7
    definition: The three released seed-42 MC probe heads, averaged across folds.
      This is the model set this repository's evaluation scripts run.
