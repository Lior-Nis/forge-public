datasets:
  fogathome:
    hf_subdir: fogathome
    role: external_structured
    prevalence: 0.356
    n_patients: 12
  dailyliving:
    hf_subdir: fogathome_dailyliving
    activity_sidecar: fogathome_dailyliving/activity.parquet
    role: external_naturalistic
    prevalence: 0.0109
    prevalence_eligible: 0.0292
    n_patients: 11
  tdcs_fog:
    hf_subdir: kaggle_labeled/tdcsfog
    role: external_provoked
    sampling_rate_hz: 128
    evaluation_rate_hz: 100
    n_patients: 71
  stanford:
    source: https://github.com/stanfordnmbl/imu-fog-detection
    revision: e95687842801ca3565463486a50d562fff44d182
    role: external_cross_device
    n_patients: 7
  kaggle:
    hf_subdir: kaggle_labeled
    role: in_distribution
    n_patients: 128
results:
- id: fogathome_icc_tf
  model: mc_probe_ensemble
  cohort: fogathome
  metric: ICC(%TF)
  value: 0.899
  ci:
  - 0.7
  - 0.97
  basis: participant-level, 227,500 public-pipeline frames, threshold 0.35
  figure: fig03
  script: ./reproduce.sh --datasets fogathome
  verification: one_click
- id: fogathome_auroc
  model: mc_probe_ensemble
  cohort: fogathome
  metric: AUROC
  value: 0.887
  ci:
  - 0.83
  - 0.922
  basis: frame-level, 227,500 public-pipeline frames
  script: ./reproduce.sh --datasets fogathome
  verification: one_click
- id: fogathome_ap
  model: mc_probe_ensemble
  cohort: fogathome
  metric: AP
  value: 0.804
  ci:
  - 0.573
  - 0.902
  basis: frame-level, 227,500 public-pipeline frames; NormAP 0.695
  script: ./reproduce.sh --datasets fogathome
  verification: one_click
- id: tdcs_auroc
  model: mc_probe_ensemble
  cohort: tdcs_fog
  metric: AUROC
  value: 0.917
  basis: frame-level, 7,220,623 frames from all 71 participants, resampled 128 ->
    100 Hz
  script: ./reproduce.sh --datasets tdcsfog
  verification: one_click
- id: tdcs_ap
  model: mc_probe_ensemble
  cohort: tdcs_fog
  metric: AP
  value: 0.866
  ci:
  - 0.661
  - 0.946
  basis: frame-level, same all-71 nine-head assembly as AUROC and ICC(%TF)
  script: ./reproduce.sh --datasets tdcsfog
  verification: one_click
- id: tdcs_icc_tf
  model: mc_probe_ensemble
  cohort: tdcs_fog
  metric: ICC(%TF)
  value: 0.876
  basis: participant-level, threshold 0.35; sens 0.717 / spec 0.850
  script: ./reproduce.sh --datasets tdcsfog
  verification: one_click
- id: stanford_auroc
  model: mc_probe_ensemble
  cohort: stanford
  metric: AUROC
  value: 0.734
  basis: frame-level, lumbar APDM channel resampled 128 -> 100 Hz
  script: ./reproduce.sh --datasets stanford
  verification: one_click
- id: stanford_ap
  model: mc_probe_ensemble
  cohort: stanford
  metric: AP
  value: 0.4
  basis: frame-level
  script: ./reproduce.sh --datasets stanford
  verification: one_click
- id: stanford_icc_tf
  model: mc_probe_ensemble
  cohort: stanford
  metric: ICC(%TF)
  value: -0.119
  basis: participant-level at the unchanged 0.35 threshold; the oracle-rule threshold
    is 0.18 (ICC 0.327). Operating point does not transfer.
  script: ./reproduce.sh --datasets stanford
  verification: one_click
- id: dailyliving_auroc
  model: mc_probe_ensemble
  cohort: dailyliving
  metric: AUROC
  value: 0.803
  ci:
  - 0.737
  - 0.877
  basis: frame-level within the walking-and-standing eligible domain (58.18 h)
  figure: fig05
  script: ./reproduce.sh --datasets dailyliving
  verification: one_click
- id: dailyliving_ap
  model: mc_probe_ensemble
  cohort: dailyliving
  metric: AP
  value: 0.105
  basis: eligible domain, prevalence 2.92%; NormAP 0.078
  script: ./reproduce.sh --datasets dailyliving
  verification: one_click
- id: dailyliving_icc_tf
  model: mc_probe_ensemble
  cohort: dailyliving
  metric: ICC(%TF)
  value: 0.656
  ci:
  - -0.129
  - 0.872
  basis: participant-level eligible-domain %TF, threshold 0.35; MAE 2.38 pp
  script: ./reproduce.sh --datasets dailyliving
  verification: one_click
- id: defog_window_ap
  model: mc_probe_3fold_seed42
  cohort: kaggle
  model_members:
  - mc_probe_fold0
  - mc_probe_fold1
  - mc_probe_fold2
  metric: AP
  value: 0.73
  basis: window-level AP on held-out DeFOG folds, seed 42 (Supp. Table S8)
  verification: recorded
  verification_note: Internal DeFOG validation is intentionally excluded from public
    external reproduction.
