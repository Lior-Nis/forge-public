meta:
  paper: Self-supervised learning improves cross-cohort freezing-of-gait detection
    from a single lower-back accelerometer
  authors: Lior Nisimov, Amit Salomon, Eran Gazit, Talia Herman, Lior Rokach, Jeffrey
    M. Hausdorff, Nathaniel Shimoni
  headline_model: mc_probe_ensemble
  released_seed: 42
  manuscript_seeds:
  - 42
  - 43
  - 44
  headline_model_note: The manuscript's released detector is nine BiGRU heads (3 participant
    folds x 3 seeds) over one shared frozen MC encoder. This repo ships the seed-42
    heads (mc_probe_fold{0,1,2}.safetensors), which rebuild the seed-42 three-fold
    ensemble -- the configuration this repo's eval scripts run. Each head file already
    contains its encoder, so encoders/*.safetensors are needed only to train new heads.
    Values under `results` are the nine-head numbers; the seed-42 subset lands within
    ~0.02 of them.
  weights_format: 'safetensors, weights only. Each file holds trained tensors and
    data-derived normalisation buffers -- no training configuration, no optimiser
    state, no file paths. Rebuild a model from the `experiment` config named on its
    entry: utils.released_weights.load_released_model().'
  threshold_protocol: defog_val_pr11
  license: MIT
  hf_weights_repo: Liornis/forge-fog
  hf_dataset_repo: Liornis/fog-dataset
encoders:
  lc:
    name: encoder_lc_mae
    hf_path: encoders/lc.safetensors
    local: release/forge-fog/encoders/lc.safetensors
    experiment: pretraining/spectral_patch_mae_daily
    window_frames: 1000
    vit_depth: 4
    params: 14147072
    role: FORGE backbone (long context, 10s)
  mc:
    name: encoder_mc_mae
    hf_path: encoders/mc.safetensors
    local: release/forge-fog/encoders/mc.safetensors
    experiment: pretraining/spectral_patch_mae_medcontext_daily
    window_frames: 500
    vit_depth: 4
    params: 14147072
    role: FORGE backbone (medium context, 5s)
  sc:
    name: encoder_sc_mae
    hf_path: encoders/sc.safetensors
    local: release/forge-fog/encoders/sc.safetensors
    experiment: pretraining/spectral_patch_mae_shortcontext_daily
    window_frames: 200
    vit_depth: 4
    params: 12918272
    role: FORGE backbone (short context, 2s)
