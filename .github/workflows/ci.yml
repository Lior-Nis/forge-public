name: CI

# Cross-platform setup/smoke test. Verifies that an external researcher can, on
# Linux / macOS / Windows: install the project, import it, resolve the Hydra
# configs for the headline experiments, and pass the (CPU) test suite. GPU tests
# skip automatically (skipif not torch.cuda.is_available()).
#
# NOT exercised here (GitHub runners have no GPU and the data is ~10 GB): the
# actual GPU inference reproduction of the paper numbers (see release/manifest.yaml).
# That is verified locally per the reproduce-evaluations skill, and could be wired
# to a self-hosted GPU runner if CI-level result verification is ever wanted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # bash is available on all three runners (git-bash on Windows)

jobs:
  repro-smoke:
    name: repro-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Import smoke
        run: uv run python -c "import data, model, pipeline, managers, utils; print('imports OK')"

      - name: Resolve Hydra configs for the headline experiments
        run: |
          uv run python scripts/train.py experiment=classification/best_fixed --cfg job > /dev/null
          uv run python scripts/train.py experiment=classification/spectral_patch_mae_mc_valid_defog_soft --cfg job > /dev/null
          uv run python scripts/train.py experiment=pretraining/spectral_patch_mae_medcontext_daily --cfg job > /dev/null

      - name: Evaluation entrypoints parse (--help)
        run: |
          uv run python -m data.process --help > /dev/null
          uv run python scripts/eval/eval_comprehensive.py --help > /dev/null
          uv run python scripts/eval/compute_icc_thresholds.py --help > /dev/null
          uv run python reproduce.py --help > /dev/null

      - name: Byte-compile core packages
        run: uv run python -m compileall -q src

      - name: Run test suite
        run: uv run pytest tests/ -q
