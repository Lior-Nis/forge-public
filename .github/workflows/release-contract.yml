name: Public release contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install frozen runtime
        run: uv sync --frozen

      - name: Verify pinned public assets
        run: uv run python reproduce.py --verify-assets-only

      - name: Upload verification provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-contract
          path: logs/reproduction_run.json
          if-no-files-found: warn
