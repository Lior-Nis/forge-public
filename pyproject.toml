[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-fog"
version = "0.1.0"
description = "Accelerometer-based FOG classification and self-supervised learning pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [ { name = "Lior Nis" } ]
license = "MIT"
keywords = ["parkinson", "freezing-of-gait", "accelerometer", "deep-learning", "pytorch", "self-supervised"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
# Runtime dependencies used by training and the released-detector reproduction.
dependencies = [
  "hydra-core>=1.3.2",
  "huggingface-hub>=0.36.0",
  "litmodels>=0.1.8",
  "matplotlib==3.10.0",
  "numpy==1.26.4",
  "omegaconf>=2.3.0",
  "openpyxl>=3.1.5",
  "pandas==2.3.1",
  "Pillow==11.3.0",
  "pingouin==0.5.5",
  "ptwt==1.0.0",
  "pyarrow>=24.0.0",
  "pydantic>=2.12.5",
  "pytorch_lightning>=2.0.0,<3.0.0",
  "rich>=14.2.0",
  "scikit_learn==1.6.1",
  "scipy==1.15.3",
  "safetensors>=0.7.0",
  "timm>=1.0.24",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchvision==0.24.1",
  "tqdm==4.67.1",
  "wandb==0.23.0",
  "zarr>=3.1.5",
]

[project.optional-dependencies]
# Interactive and exploratory analysis scripts.
analysis = [
  "captum==0.8.0",
  "dash>=4.0.0",
  "dash-bootstrap-components>=2.0.4",
  "seaborn==0.13.2",
  "umap-learn>=0.5.12",
]
# Developer / test extras.
dev = [
  "pytest==8.4.1",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "model*", "pipeline*", "managers*", "utils*"]

[tool.pytest.ini_options]
addopts = "-ra"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "outputs", "logs", "wandb", "artifacts"]

[tool.ruff.lint]
# Conservative default ruleset; the codebase is research code.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line-length handled by the formatter

# --- PyTorch wheels -------------------------------------------------------
# Linux/macOS resolve torch/vision/audio from the default PyPI index (the
# verified setup; Linux gets CUDA via the bundled manylinux wheel). On Windows
# the PyPI wheel is CPU-only, so pull the CUDA 12.6 build from the PyTorch index
# instead -- this lets a native-Windows machine use its NVIDIA GPU (e.g. an
# RTX 3060). If the GPU/driver is unavailable the eval falls back to CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
